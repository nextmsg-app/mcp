name: release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z matching package.json).
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. The package's
# trusted publisher on npmjs.com must name this repository and this workflow file.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.21.3 (trusted publishing needs 11.5.1 or newer; pinned, not latest)
        run: npm install -g npm@11.21.3
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
      - run: npm test
      - run: npm publish --provenance --access public

      # MCP Registry (registry.modelcontextprotocol.io): publishes server.json as
      # io.github.nextmsg-app/mcp, authenticated by this workflow's GitHub OIDC token
      - name: Set server.json version from package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.11
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The registry checks mcpName in the npm package, which can take a minute to appear
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; sleep 20; done
          exit 1
